services:
  reset-scheduler:
    build:
      context: .
      args:
        HTTP_PROXY: http://host.docker.internal:9999
        HTTPS_PROXY: http://host.docker.internal:9999
        NO_PROXY: localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,host.docker.internal
    container_name: 88code_reset_scheduler
    restart: unless-stopped
    environment:
      # 支持 API_KEYS 和 API_KEY 两种格式
      - API_KEYS=${API_KEYS}
      - API_KEY=${API_KEYS}
      # 代理配置
      - HTTP_PROXY=http://host.docker.internal:9999
      - HTTPS_PROXY=http://host.docker.internal:9999
      - NO_PROXY=localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,host.docker.internal
      # 其他配置
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - CREDIT_THRESHOLD_MAX=${CREDIT_THRESHOLD_MAX:-83}
      - ENABLE_FIRST_RESET=${ENABLE_FIRST_RESET:-false}
      - PLANS=${PLANS}
    env_file:
      - .env
    volumes:
      # 持久化数据目录
      - ./data:/app/data
      # 持久化日志目录
      - ./logs:/app/logs
    command: ["-mode=run", "-datadir=/app/data", "-logdir=/app/logs"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 可选：用于测试的临时容器
  reset-test:
    build:
      context: .
      args:
        HTTP_PROXY: http://host.docker.internal:9999
        HTTPS_PROXY: http://host.docker.internal:9999
        NO_PROXY: localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,host.docker.internal
    container_name: 88code_reset_test
    environment:
      # 支持 API_KEYS 和 API_KEY 两种格式
      - API_KEYS=${API_KEYS}
      - API_KEY=${API_KEYS}
      # 代理配置
      - HTTP_PROXY=http://host.docker.internal:9999
      - HTTPS_PROXY=http://host.docker.internal:9999
      - NO_PROXY=localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,host.docker.internal
      # 其他配置
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - CREDIT_THRESHOLD_MAX=${CREDIT_THRESHOLD_MAX:-83}
      - ENABLE_FIRST_RESET=${ENABLE_FIRST_RESET:-false}
      - PLANS=${PLANS}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["-mode=test", "-datadir=/app/data", "-logdir=/app/logs"]
    profiles:
      - test
    extra_hosts:
      - "host.docker.internal:host-gateway"
